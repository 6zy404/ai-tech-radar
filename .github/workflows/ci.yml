name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # The validators are most of the project's regression coverage (about
      # 7,800 lines against 4,800 of unit tests). They run against a throwaway
      # copy of config/ made by scripts/run-ts-validation.cjs, so they never
      # touch the checked-in data. validate:database needs node:sqlite (>= 22.5).
      - name: Workflow validators
        run: npm run validate:all
